# Production: PostgreSQL. Connection details come from environment variables.
# No defaults on purpose: the app fails fast if one is missing.
# ddl-auto=validate never changes the schema. In a real system the schema
# is created by a migration tool (e.g. Flyway), which is not part of this task.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.tutorial: INFO
