# Staging: PostgreSQL. Connection details come from environment variables.
# No defaults on purpose: the app fails fast if one is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.tutorial: INFO
