# Settings shared by every environment.
# Environment-specific settings live in application-{profile}.yml.
spring:
  application:
    name: tutorial
  profiles:
    # Used when no profile is set (spring.profiles.active / SPRING_PROFILES_ACTIVE).
    default: local
  jpa:
    open-in-view: false
  flyway:
    # Runs the scripts in db/migration automatically on startup.
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Details (db, customerStore, disk space) only for ADMIN; everyone else sees just the status.
      show-details: when-authorized
      roles: ADMIN

info:
  app:
    name: Spring Boot Tutorial
    description: Customer CRUD with security, profiles, Flyway and Actuator
